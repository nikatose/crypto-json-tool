<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto JSON Tool</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    textarea {
      width: 100%;
      height: 220px;
      margin-top: 20px;
      padding: 15px;
      box-sizing: border-box;
      background: #1b1b1b;
      color: #eee;
      border: 1px solid #444;
      border-radius: 8px;
      font-family: monospace;
    }

    button {
      margin-top: 15px;
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .summary {
      margin-top: 25px;
      padding: 20px;
      background: #1b1b1b;
      border-radius: 10px;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #333;
      text-align: left;
    }

    .error {
      color: #ff7070;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h1>Crypto JSON Tool</h1>
  <p>Paste a simple crypto portfolio JSON and calculate its total value.</p>

  <textarea id="jsonInput">[
  {
    "symbol": "BTC",
    "amount": 0.25,
    "price": 65000
  },
  {
    "symbol": "ETH",
    "amount": 2,
    "price": 2500
  },
  {
    "symbol": "USDT",
    "amount": 1000,
    "price": 1
  }
]</textarea>

  <button onclick="analyzePortfolio()">
    Analyze Portfolio
  </button>
  
  <button onclick="copyJSON()">
    Copy JSON
</button>

  <div id="result"></div>

  <script>
    function analyzePortfolio() {
      const input = document.getElementById("jsonInput").value;
      const result = document.getElementById("result");

      try {
        const portfolio = JSON.parse(input);

        if (!Array.isArray(portfolio)) {
          throw new Error("JSON must contain an array.");
        }

        let total = 0;

        const rows = portfolio.map(asset => {
          const value = asset.amount * asset.price;

          total += value;

          return `
            <tr>
              <td>${asset.symbol}</td>
              <td>${asset.amount}</td>
              <td>$${asset.price.toLocaleString()}</td>
              <td>$${value.toLocaleString()}</td>
            </tr>
          `;
        }).join("");

        result.innerHTML = `
          <div class="summary">
            <h2>Total Portfolio Value</h2>
            <h1>$${total.toLocaleString()}</h1>

            <table>
              <thead>
                <tr>
                  <th>Asset</th>
                  <th>Amount</th>
                  <th>Price</th>
                  <th>Value</th>
                </tr>
              </thead>

              <tbody>
                ${rows}
              </tbody>
            </table>
          </div>
        `;

      } catch (error) {
        result.innerHTML = `
          <div class="error">
            Invalid JSON: ${error.message}
          </div>
        `;
      }
    }
    function copyJSON() {
  const input = document.getElementById("jsonInput");

  navigator.clipboard.writeText(input.value)
    .then(() => {
      alert("Portfolio JSON copied!");
    })
    .catch(() => {
      alert("Could not copy JSON.");
    });
}
  </script>

</body>
</html>
